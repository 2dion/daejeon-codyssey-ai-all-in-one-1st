<svg xmlns="http://www.w3.org/2000/svg" width="900" height="550" viewBox="0 0 900 550" role="img" aria-labelledby="title desc">
<title id="title">파일 권한 문자열과 숫자 읽는 법</title><desc id="desc">-rwxr-xr--는 일반 파일, 소유자 rwx 7, 그룹 r-x 5, 그 외 r-- 4를 뜻한다. r은 4, w는 2, x는 1, 하이픈은 0이다.</desc>
<rect width="900" height="550" fill="#ffffff"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif" fill="#17212b">
<text x="28" y="40" font-size="27" font-weight="700">한 글자씩 보지 말고, 1 + 3 + 3 + 3으로 나누기</text>
<text x="28" y="70" font-size="17" fill="#526170">예시: -rwxr-xr-- → 일반 파일, 권한 754</text>
<rect x="28" y="105" width="105" height="90" rx="10" fill="#eef1f4"/>
<rect x="144" y="105" width="232" height="90" rx="10" fill="#dcecf9"/>
<rect x="387" y="105" width="232" height="90" rx="10" fill="#e3f2ed"/>
<rect x="630" y="105" width="242" height="90" rx="10" fill="#f9efdf"/>
<text x="80" y="136" text-anchor="middle" font-size="16" fill="#526170">종류</text>
<text x="260" y="136" text-anchor="middle" font-size="16" fill="#315b80">소유자</text>
<text x="503" y="136" text-anchor="middle" font-size="16" fill="#286451">그룹</text>
<text x="751" y="136" text-anchor="middle" font-size="16" fill="#875c20">그 외</text>
<g font-family="Menlo,Consolas,monospace" font-size="35" font-weight="700">
<text x="80" y="178" text-anchor="middle">-</text>
<text x="260" y="178" text-anchor="middle">rwx</text>
<text x="503" y="178" text-anchor="middle">r-x</text>
<text x="751" y="178" text-anchor="middle">r--</text>
</g>
<text x="80" y="226" text-anchor="middle" font-size="17">일반 파일</text>
<text x="260" y="226" text-anchor="middle" font-size="17">읽기 + 쓰기 + 실행</text>
<text x="503" y="226" text-anchor="middle" font-size="17">읽기 + 실행</text>
<text x="751" y="226" text-anchor="middle" font-size="17">읽기만</text>
<text x="80" y="262" text-anchor="middle" font-size="17" fill="#526170">d면 폴더</text>
<text x="260" y="262" text-anchor="middle" font-size="23" font-weight="700" fill="#315b80">4 + 2 + 1 = 7</text>
<text x="503" y="262" text-anchor="middle" font-size="23" font-weight="700" fill="#286451">4 + 0 + 1 = 5</text>
<text x="751" y="262" text-anchor="middle" font-size="23" font-weight="700" fill="#875c20">4 + 0 + 0 = 4</text>
<path d="M28 289H872" stroke="#d4dce2"/>
<text x="28" y="325" font-size="20" font-weight="700">기호의 값</text>
<g font-size="18"><text x="28" y="357">r = 읽기 = 4</text><text x="230" y="357">w = 쓰기 = 2</text><text x="442" y="357">x = 실행 = 1</text><text x="657" y="357">- = 없음 = 0</text></g>
<rect x="28" y="390" width="844" height="112" rx="10" fill="#f4f6f8"/>
<text x="48" y="421" font-size="18" font-weight="700">자주 보는 또 다른 예: -rw-r--r-- = 644</text>
<text x="48" y="452" font-size="17">소유자 rw- = 4+2+0 = 6  /  그룹 r-- = 4  /  그 외 r-- = 4</text>
<text x="48" y="481" font-size="16" fill="#526170">맨 앞 -는 파일 종류. 중간의 -는 그 권한이 없다는 표시다.</text>
<text x="28" y="533" font-size="15" fill="#526170">디렉터리에서 x는 프로그램 실행이 아니라 그 경로를 통과해 항목에 접근하는 권한이다.</text>
</g></svg>